<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prueba segura de alerta amarilla</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17243b;font:16px/1.5 system-ui,Arial,sans-serif}
    main{width:min(420px,calc(100% - 40px));padding:28px;background:white;border:1px solid #dce5ef;border-radius:16px;box-shadow:0 16px 45px #1d35571c}
    h1{margin-top:0;font-size:24px}label,input{display:block;width:100%;box-sizing:border-box}input{margin:7px 0 16px;padding:11px;border:1px solid #aebdce;border-radius:8px}button{padding:11px 16px;border:0;border-radius:8px;background:#1769dc;color:white;font:inherit}
    small{display:block;margin-top:18px;color:#607089}
  </style>
</head>
<body>
  <main>
    <h1>Página local de prueba</h1>
    <p>Este formulario no transmite ni almacena información. Existe únicamente para comprobar la alerta amarilla de Escudo-Transparente.</p>
    <form onsubmit="return false">
      <label for="password">Contraseña ficticia</label>
      <input id="password" type="password" autocomplete="off" placeholder="No escribas una contraseña real">
      <button type="submit">Prueba sin envío</button>
    </form>
    <small>Al servirse mediante HTTP local, la extensión debe detectar un formulario de contraseña sin cifrado y mostrar riesgo medio.</small>
  </main>
</body>
</html>
